[SERVICE]
    Flush           1
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020

[INPUT]
    Name            tail
    Path            /app-logs/app.log
    Parser          navigation-menu-json
    Tag             navigation-menu.log
    Read_from_Head  Off
    DB              /var/lib/fluent-bit/tail.db
    Mem_Buf_Limit   5MB
    Skip_Long_Lines On
    Inotify_Watcher Off
    Refresh_Interval 1

[FILTER]
    Name    modify
    Match   navigation-menu.log
    Rename  eventType event_type
    Add     env local
    Add     collector fluent-bit

[OUTPUT]
    Name              splunk
    Match             navigation-menu.log
    Host              splunk-demo
    Port              8088
    TLS               On
    TLS.Verify        Off
    Splunk_Token      ${SPLUNK_HEC_TOKEN}
    Splunk_Send_Raw   Off
    Event_Index       nav_menu
    Event_Sourcetype  _json
    Retry_Limit       False
