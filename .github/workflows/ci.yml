name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支同时只跑一条流水线。否则连着推两次会产生两个 deploy job 指向同一台
# self-hosted runner，runner 一次只接一个任务，它们会排队——而排队顺序没有保证，
# 先推的那次若后跑，最后落地的就是旧镜像。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 编译 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 直接复用 docker-compose.yml 起依赖，顺带验证 compose 和 sql/ 初始化脚本
      - name: 启动 MySQL 与 Redis
        run: docker compose up -d --wait mysql redis

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: 构建并运行测试
        run: mvn -B verify
        env:
          DB_URL: "jdbc:mysql://127.0.0.1:3307/navigation_menu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
          DB_USERNAME: root
          DB_PASSWORD: root123
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6380"
          REDIS_PASSWORD: redis123

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: 清理
        if: always()
        run: docker compose down -v

  image:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # fork 来的 PR 拿不到写权限，只在 push 到 main 时登录推送
      - name: 登录 GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建 Docker 镜像
        # 推送到 GHCR.io
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # 镜像名必须全小写，而 GitHub 仓库名允许大写字母，所以写死小写字面量
          tags: |
            ghcr.io/zzz-jjj-hhh/navigation-menu:${{ github.sha }}
            ghcr.io/zzz-jjj-hhh/navigation-menu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 部署到本机
    # 跑在你自己的电脑上，不是 GitHub 的机器
    runs-on: [self-hosted, navigation-menu-deploy]
    needs: image
    # 只认 push 到 main。self-hosted runner 绝不能接 fork 来的 PR，
    # 否则任何人都能靠一个 PR 在你的电脑上执行任意代码
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ghcr.io/zzz-jjj-hhh/navigation-menu:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # GHCR 包默认私有，只继承仓库的访问权限而不继承可见性，必须登录才能拉
      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取本次提交对应的镜像
        run: docker compose pull app

      # 只改了文档时 tag 会变但镜像内容不变，此时不该动正在运行的容器。
      # 脚本保持纯 ASCII：runner 可能用 Windows PowerShell 5.1 读取该临时脚本。
      - name: 判断镜像内容是否变化
        id: diff
        run: |
          $target = docker image inspect $env:APP_IMAGE --format '{{.Id}}'
          $cid = docker compose ps -q app
          $current = if ($cid) { docker inspect $cid --format '{{.Image}}' } else { '' }
          $running = if ($cid) { docker inspect $cid --format '{{.State.Running}}' } else { 'false' }
          Write-Host "target  = $target"
          Write-Host "current = $current (running=$running)"
          $same = ($current -eq $target) -and ($running -eq 'true')
          $val = if ($same) { 'false' } else { 'true' }
          Write-Host "changed = $val"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "changed=$val`n")

      - name: 用新镜像重启应用
        if: steps.diff.outputs.changed == 'true'
        run: docker compose up -d --wait --no-build

      - name: 镜像内容未变化，容器保持不动
        if: steps.diff.outputs.changed == 'false'
        run: Write-Host "image id unchanged, container left as is"

      - name: 验证服务健康
        run: curl.exe -fsS http://localhost:8080/actuator/health
