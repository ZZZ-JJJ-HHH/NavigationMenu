name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 编译 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 直接复用 docker-compose.yml 起依赖，顺带验证 compose 和 sql/ 初始化脚本
      - name: 启动 MySQL 与 Redis
        run: docker compose up -d --wait mysql redis

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: 构建并运行测试
        run: mvn -B verify
        env:
          DB_URL: "jdbc:mysql://127.0.0.1:3307/navigation_menu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
          DB_USERNAME: root
          DB_PASSWORD: root123
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6380"
          REDIS_PASSWORD: redis123

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: 清理
        if: always()
        run: docker compose down -v

  image:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 只验证 Dockerfile 能不能构建；以后接 CD 时在这里加 push 到镜像仓库
      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: navigation-menu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
