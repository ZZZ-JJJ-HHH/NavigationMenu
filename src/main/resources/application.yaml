spring:
  application:
    name: navigation-menu

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/navigation_menu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

management:
  endpoints:
    web:
      exposure:
        # prometheus 得能被采集器拉到，所以必须暴露。
        # 生产上更稳的做法是让整个 Actuator 只挂在管理端口、内网可达，而不是跟着业务端口外露
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      # 每条指标都带上服务名：将来多个服务共用一个 Prometheus 时才分得清谁是谁
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 开直方图，Prometheus 侧才能用 histogram_quantile 算出 P95 / P99
        http.server.requests: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.navigation_menu.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

server:
  port: 8080

logging:
  # 控制台格式和 JSON 文件输出统一在 logback-spring.xml 里配置，这里只管级别
  level:
    com.example.navigation_menu: INFO
    # SQL 日志是 DEBUG 级别，打开它才能进日志文件。
    # 生产环境应改回 INFO 关掉，需要临时排查时用 /actuator/loggers 在运行时打开
    com.example.navigation_menu.mapper: DEBUG
